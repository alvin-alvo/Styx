version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: styx
    ports:
      - "5432:5432"

  backend:
    build: 
      context: ./backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/styx
      - NGINX_LOG_PATH=/app/logs/access.log
      - OPENAPI_SPEC_PATH=/app/openapi.json
    ports:
      - "8000:8000"
    volumes:
      - shared_logs:/app/logs
      - ./openapi.json:/app/openapi.json:ro
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  gateway:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - shared_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend

volumes:
  shared_logs:
